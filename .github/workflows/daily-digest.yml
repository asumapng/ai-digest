name: Daily AI Digest

on:
  schedule:
    - cron: '30 3 * * *' # 3:30 AM UTC = 9:00 AM IST
  workflow_dispatch: # Allows manual trigger

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      
      - name: Install dependencies
        run: npm install
      
      - name: Run Digest Script
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: npx tsx scripts/daily_newsletter.ts

      - name: Commit and Push Database changes
        run: |
          git config --global user.name "AI Digest Bot"
          git config --global user.email "bot@aidigest.co"
          git add newsletter.db
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update news archive [skip ci]" && git push)
